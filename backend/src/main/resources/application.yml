spring:
  application:
    name: musicapp
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/musicapp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/db.changelog-master.xml

  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket-name: musicapp-017719539384-eu-south-1-an
    region: eu-south-1

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    com.musicapp: DEBUG
    org.hibernate.SQL: DEBUG
