services:
  postgres:
    image: postgres:15-alpine
    container_name: musicapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musicapp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_qui}
    volumes:
      - musicapp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musicapp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musicapp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-musicapp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_qui}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./cookies.txt:/app/cookies.txt
    ports:
      # Espone la porta 8085 su localhost del VPS per essere raggiunta da Nginx
      - "127.0.0.1:8085:8080"
    networks:
      - musicapp-network

volumes:
  musicapp-postgres-data:

networks:
  musicapp-network:
    name: musicapp-network
